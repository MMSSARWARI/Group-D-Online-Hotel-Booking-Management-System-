<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aysan Luxury Hotel - Admin</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <header>
    <div class="navbar">
        <div class="logo">
           <a href="index.html"><img src="./access/Logo.jpg" alt="Logo"></a>
        </div>
        <div class="right-menue">
        <ul class="menue-list">
            <a href="index.html"><li>Back to website</li></a>
            <a id="logoutLink" style="display: none;"><li>Log out</li></a>
        </ul>
        </div>
    </div>
  </header>

  <!-- Admin login -->
  <div class="container booking-container" id="loginBox">
    <h2 class="form-title">Admin Login</h2>
    <form id="loginForm">
      <div class="mb-3">
        <label for="adminUsername" class="form-label">Admin ID</label>
        <input type="text" class="form-control" id="adminUsername" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label for="adminPassword" class="form-label">Password</label>
        <input type="password" class="form-control" id="adminPassword" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-custom w-100">Log in</button>
      <div id="loginMessage"></div>
    </form>
  </div>

  <!-- Report: only shown after login -->
  <section id="reporting" style="display: none;">
    <div class="container mt-4">
      <h2>Booking and Room Report</h2>

      <div class="row text-center mb-4">
        <div class="col-md-4">
          <div class="card"><div class="card-body">
            <h5>Total Bookings</h5>
            <p id="totalBookings">-</p>
          </div></div>
        </div>
        <div class="col-md-4">
          <div class="card"><div class="card-body">
            <h5>Available Rooms</h5>
            <p id="availableRooms">-</p>
          </div></div>
        </div>
        <div class="col-md-4">
          <div class="card"><div class="card-body">
            <h5>Total Customers</h5>
            <p id="totalCustomers">-</p>
          </div></div>
        </div>
      </div>

      <h4>Current Bookings</h4>
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Booking ID</th>
            <th>Customer Name</th>
            <th>Email</th>
            <th>Room Type</th>
            <th>Check-In</th>
            <th>Check-Out</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="bookingsTable"></tbody>
      </table>

      <h4>Room Availability</h4>
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Room ID</th>
            <th>Type</th>
            <th>Price per night</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="roomsTable"></tbody>
      </table>
    </div>
  </section>

  <script src="./script.js"></script>
</body>
</html>
