<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aysan Luxury Hotel - Room Booking</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <header>
    <div class="navbar">
        <div class="logo">
           <a href="index.html"><img src="./access/Logo.jpg" alt="Logo"></a>
        </div>
        <div class="right-menue">
        <ul class="menue-list">
            <a href="index.html#home"><li>Home</li></a>
            <a href="index.html#about"><li>About</li></a>
            <a href="index.html#rooms"><li>Rooms</li></a>
            <a href="booking.html"><li>Booking</li></a>
            <a href="index.html#contact"><li>Contact</li></a>
        </ul>
        <div class="followMe">
        <h6>Follow Me</h6>
        <div class="social-icons">
            <a href="#"><i class="fab fa-facebook-f"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
        </div>
        </div>
        </div>
    </div>
  </header>

  <!-- Booking -->
  <div class="container booking-container" id="booking">
    <h2 class="form-title">Aysan Luxury Hotel – Book a Room</h2>

    <form id="bookingForm">
      <div class="mb-3">
        <label for="guestName" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="guestName" placeholder="e.g., Ahmad Wali" required>
      </div>

      <div class="mb-3">
        <label for="guestEmail" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="guestEmail" placeholder="e.g., ahmad@example.com" required>
      </div>

      <div class="mb-3">
        <label for="guestPhone" class="form-label">Phone Number</label>
        <input type="tel" class="form-control" id="guestPhone" placeholder="e.g., +93 700 123 456" maxlength="15" required>
      </div>

      <div class="mb-3">
        <label for="roomSelect" class="form-label">Select Room</label>
        <select class="form-select" id="roomSelect" required>
          <option value="">Loading rooms...</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="checkIn" class="form-label">Check-In Date</label>
        <input type="date" class="form-control" id="checkIn" required>
      </div>

      <div class="mb-3">
        <label for="checkOut" class="form-label">Check-Out Date</label>
        <input type="date" class="form-control" id="checkOut" required>
      </div>

      <button type="submit" class="btn btn-custom w-100">Confirm Booking</button>
      <div id="bookingMessage"></div>
    </form>
  </div>

  <script src="./script.js"></script>
</body>
</html>
