<body>
    <!-------------------------- Booking ----------------------------------- -->
    <div class="container booking-container" id="booking">
        <h2 class="form-title">Aysan Luxury Hotel – Book a Room</h2>
        
        <form id="bookingForm" onsubmit="return validateBookingForm()">
          <div class="mb-3">
            <label for="guestName" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="guestName" name="guestName" placeholder="e.g., Ahmad Wali" required>
          </div>
      
          <div class="mb-3">
            <label for="guestEmail" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="guestEmail" name="guestEmail" placeholder="e.g., ahmad@example.com" required>
          </div>
      
          <div class="mb-3">
            <label for="guestPhone" class="form-label">Phone Number</label>
            <input type="tel" class="form-control" id="guestPhone" name="guestPhone" placeholder="e.g., ‪+93 700 123 456‬" required>
          </div>
      
          <div class="mb-3">
            <label for="roomType" class="form-label">Select Room Type</label>
            <select class="form-select" id="roomType" name="roomType" required>
              <option value="">-- Choose Room Type --</option>
              <option value="Single Room">Single Room (1 Bed)</option>
              <option value="Double Room">Double Room (2 Beds)</option>
              <option value="Deluxe Suite">Deluxe Suite</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="checkIn" class="form-label">Check-In Date</label>
            <input type="date" class="form-control" id="checkIn" name="checkIn" required>
          </div>
      
          <div class="mb-3">
            <label for="checkOut" class="form-label">Check-Out Date</label>
            <input type="date" class="form-control" id="checkOut" name="checkOut" required>
          </div>
      
          <button type="submit" class="btn btn-custom w-100">Confirm Booking</button>
        </form>
      </div>
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="./script.js"></script>
    
</body>
